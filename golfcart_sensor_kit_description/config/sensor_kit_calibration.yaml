# Golf cart sensor kit calibration derived from the golf-* LCTK sessions.
# Lengths are meters; roll/pitch/yaw are URDF fixed-axis XYZ radians.
# sensor_kit_base_link is placed at the VLP-32C origin (frame: velodyne).
sensor_kit_base_link:
  vlp32c:
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  # Child frame seyond. Weighted merge of the three independent camera paths.
  # All six source archives have a DEGENERATE Quality Verdict.
  # Routes are T_velodyne<-seyond; xyz is meters and RPY is radians:
  # left:  xyz 2.479202, 0.130762, -1.413522; rpy -0.045843, -1.331533, -3.099451
  # right: xyz 2.250433, 0.087553, -1.443377; rpy -0.082682, -1.332437, -3.075117
  # zed:   xyz 2.135131, 0.026951, -1.428290; rpy -0.078874, -1.334083, -3.069236
  # Weighted by inverse propagated uncertainty; rotations use a weighted SO(3) mean.
  falcon:
    x: 2.197845303
    y: 0.05262411
    z: -1.430838877
    roll: -0.077524484
    pitch: -1.333385551
    yaw: -3.073378269
  # These poses were measured in base_link while base_link and sensor_kit_base_link
  # coincided. Converted with the active vehicle sensors_calibration.yaml:
  # T_base_link<-sensor_kit_base_link = (0.46, 0, 1.966; RPY -0.016794, 0.031978, 0).
  # The six LCTK archives do not solve these sensors.
  imu_link:
    x: -1.124434567
    y: 0.033220893
    z: -0.191518348
    roll: 0.016802589
    pitch: -0.031973489
    yaw: -0.000537196
  gnss_base_link:
