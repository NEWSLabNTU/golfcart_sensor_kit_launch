    y: 0.02847863
    z: -1.695602761
    roll: -0.016802674
    pitch: 0.031973444
    yaw: 3.141052803
  camera_left:
    x: 0.9426154546835364
    y: 0.5584876525550044
    z: -1.1269152055909257
    roll: -0.08157476261707551
    pitch: -0.1090220082688429
