/**:
  ros__parameters:
    debug: 0
    device: /dev/ublox-gps
    frame_id: gps
    uart1:
      baudrate: 9600
    rate: 1.0
    nav_rate: 1

    # Rover mode (disabled time mode — not a base station)
    tmode3: 0

    # Explicit constellation list — F9 firmware v9 uses VALGET/VALSET;
    # polling UBX-CFG-GNSS can fail if omitted
    gnss:
      gps: true
      glonass: true
      beidou: true
      galileo: true

    inf:
      all: true

    publish:
      all: true
      aid:
        hui: false
      nav:
        posecef: false
