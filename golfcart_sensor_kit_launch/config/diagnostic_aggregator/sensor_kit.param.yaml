# DEAD CONFIG. Nothing loads this file, and nothing can.
#
# It is written for the `diagnostic_aggregator` package, and no launch file in
# this repository passes this path to anything.
#
# An earlier version of this comment said that package "is not installed in
# Autoware 1.5.0 at all" and that every `type:` below names a plugin that does
# not exist. That is FALSE and was checked on 2026-08-26:
# /opt/ros/humble/share/diagnostic_aggregator is present, and it does provide
# GenericAnalyzer and AnalyzerGroup. The file is dead because Autoware chose a
# different aggregator, not because the package is missing. The distinction
# matters to anyone deciding whether this config could be revived.
#
# The live diagnostics are the graph under
# src/launcher/golfcart_launch/config/system/diagnostics/*.yaml, which uses a
# different schema (`units:` with `path:` and `diag:`). Edit those, not this.
#
# Two further traps if anyone ports the LiDAR entries across:
#
#   - `velodyne_connection`, `velodyne_temperature` and `velodyne_rpm` are
#     published by `autoware_velodyne_monitor`, which this repository never
#     launches. Porting the analyzers without launching that node buys nothing.
#   - That node polls the LiDAR's web interface, and so does Nebula's own
#     monitor, which `udp_only: true` in ../VLP32.param.yaml disables. If the
#     web interface is why udp_only was set, neither monitor will work either.
#     `just check-sensors` reports whether it answers.
#
# Kept rather than deleted because it is the starting point for that port.
/**:
  ros__parameters:
    sensing:
      type: diagnostic_aggregator/AnalyzerGroup
      path: sensing
      analyzers:
        lidar:
          type: diagnostic_aggregator/AnalyzerGroup
          path: lidar
          analyzers:
            velodyne:
              type: diagnostic_aggregator/AnalyzerGroup
              path: velodyne
              analyzers:
                health_monitoring:
                  type: diagnostic_aggregator/AnalyzerGroup
                  path: health_monitoring
                  analyzers:
                    connection:
                      type: diagnostic_aggregator/GenericAnalyzer
                      path: connection
                      contains: [": velodyne_connection"]
                      timeout: 3.0

                    temperature:
                      type: diagnostic_aggregator/GenericAnalyzer
                      path: temperature
                      contains: [": velodyne_temperature"]
                      timeout: 3.0

                    rpm:
                      type: diagnostic_aggregator/GenericAnalyzer
                      path: rpm
                      contains: [": velodyne_rpm"]
                      timeout: 3.0

        gnss:
          type: diagnostic_aggregator/AnalyzerGroup
          path: gnss
          analyzers:
            health_monitoring:
              type: diagnostic_aggregator/AnalyzerGroup
              path: health_monitoring
              analyzers:
                connection:
                  type: diagnostic_aggregator/GenericAnalyzer
                  path: connection
                  contains: [": gnss_connection"]
                  timeout: 3.0

                data:
                  type: diagnostic_aggregator/GenericAnalyzer
                  path: data
                  contains: [": gnss_data"]
                  timeout: 3.0

                antenna:
                  type: diagnostic_aggregator/GenericAnalyzer
                  path: antenna
                  contains: [": gnss_antenna"]
                  timeout: 3.0

                tx_usage:
                  type: diagnostic_aggregator/GenericAnalyzer
                  path: tx_usage
                  contains: [": gnss_tx_usage"]
                  timeout: 3.0

                spoofing:
                  type: diagnostic_aggregator/GenericAnalyzer
                  path: spoofing
                  contains: [": gnss_spoofing"]
                  timeout: 3.0

                jamming:
                  type: diagnostic_aggregator/GenericAnalyzer
                  path: jamming
                  contains: [": gnss_jamming"]
                  timeout: 3.0

                fix_topic_status:
                  type: diagnostic_aggregator/GenericAnalyzer
                  path: fix_topic_status
                  contains: [": fix topic status"]
                  timeout: 3.0
