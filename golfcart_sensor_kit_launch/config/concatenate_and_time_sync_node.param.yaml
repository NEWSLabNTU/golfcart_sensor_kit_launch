/**:
  ros__parameters:
    debug_mode: true
    rosbag_length: 10.0
    maximum_queue_size: 5
    # How long a collector waits for the rest of its pair before publishing
    # what it has. It must stay BELOW the 100 ms scan period, and 0.2 was above
    # it: a collector opened by one sensor waited 200 ms, published, and the
    # scan that arrived during the wait was dropped
    # (publish_previous_but_late_pointcloud is false). Measured on the basement
    # replay, where the Falcon topic is absent, the output ran at 4.47 Hz
    # against a 10 Hz input and every cloud arrived 190 ms after its own stamp.
    # At 0.05 the same replay holds 10.00 Hz. The value it replaces was a
    # placeholder, committed as one in 217719a.
    #
    # The trade this makes, on the vehicle where both LiDARs are present: a
    # Falcon cloud later than 50 ms now yields a Velodyne-only concatenation
    # instead of a dropped scan. That is the right way round for localization,
    # which would rather have one sensor on time than two late, but it assumes
    # the two sensors arrive within 50 ms of each other. Measure that offset on
    # the cart and raise this if it is larger; anything below 0.1 keeps the
    # full rate. lidar_timestamp_noise_window below is a separate mechanism
    # (timestamp matching, not waiting) and is unchanged.
    timeout_sec: 0.05
    is_motion_compensated: true
    publish_synchronized_pointcloud: true
    keep_input_frame_in_synchronized_pointcloud: true
    publish_previous_but_late_pointcloud: false
    synchronized_pointcloud_postfix: pointcloud
    input_twist_topic_type: twist
    # Order is positional: lidar_timestamp_offsets and lidar_timestamp_noise_window
    # below are indexed against this list, so do not reorder without them.
    #
    # The Velodyne arrives PREPROCESSED (cropped, deskewed, outlier-filtered), on
    # pointcloud_before_sync rather than its raw driver topic. That name is the
    # same in both `pointcloud_backend` modes; in cuda mode a
    # `pointcloud_before_sync/cuda` negotiation companion appears beside it and
    # the CUDA concatenator takes the device pointer instead of the bytes.
    #
    # The Falcon arrives RAW, and not by choice: the Seyond driver publishes
    # PointXYZIRC, with no per-point time field, so nothing can deskew it. See
    # PASSTHROUGH_LIDARS in pointcloud_preprocessor.launch.py.
    input_topics: [
                    # "/iv_points",
                    "/sensing/lidar/falcon/iv_points",
                    "/sensing/lidar/vlp32/pointcloud_before_sync",
                ]
    output_frame: $(var base_frame)
    matching_strategy:
      type: advanced
      lidar_timestamp_offsets: [0.0, 0.0]
      lidar_timestamp_noise_window: [0.1, 0.1]
