/**:
  ros__parameters:
    # Camera device configuration
    video_device: "/dev/v4l/by-path/platform-tegra-capture-vi-video-index12" # visit camera_capture/ to find the real device mapping
    camera_name: "camera_left"
    camera_info_url: "package://golfcart_sensor_kit_launch/config/camera_left_calibration.yaml"
    # The optical frame, not the mounting frame. REP-103 asks image data to
    # name the frame its projection is done in -- x right, y down, z along
    # the view -- and anything that takes this at its word and finds a body
    # frame comes out rotated ninety degrees.
    frame_id: "camera_left_optical_link"

    # Image settings
    image_width: 1920
    image_height: 1280
    framerate: 30.0

    # The capture pipeline is NOT here. It is the one part that cannot be
    # settled without the hardware, so it lives in camera_capture/<profile>.yaml
    # and is selected by camera.launch.xml's capture_profile argument. That file
    # loads this one and then the profile, so the profile supplies gscam_config.
    #
    # A bare `ros2 run gscam gscam_node --params-file <this>` will therefore
    # fail with no pipeline. Pass the profile too:
    #   --params-file camera_capture/v4l2-dmabuf.yaml

    # Camera control parameters
    auto_exposure: true
    auto_white_balance: true
    brightness: 128
    contrast: 128
    saturation: 128

    # Image processing
    image_encoding: "jpeg"
    sync_sink: false
    preroll: false
    use_gst_timestamps: true

    # Performance settings
    reopen_on_eof: false
    camera_info_rescale: true
    image_raw.enable_pub_plugins: ["image_transport/compressed"]
