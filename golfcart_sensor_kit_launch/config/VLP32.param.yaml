# Velodyne VLP-32C, driven by Nebula.
#
# READ THIS BEFORE CHANGING rotation_speed OR return_mode.
#
# `udp_only: false` + `setup_sensor: true` means Nebula's HTTP client is live
# and it PUSHES this configuration to the sensor at start-up ("Setting sensor
# configuration" in the node log). These values are therefore authoritative:
# they overwrite the LiDAR's EEPROM, they are not a record of what it holds.
# Set them here, not in the web UI at http://192.168.7.10 — the web UI is only
# useful for reading back what the driver wrote.
#
# `just check-sensors` reads both values back over HTTP and compares them
# against this file. Run it after touching either.
#
# ── return_mode spelling ─────────────────────────────────────────────────
# Nebula's Velodyne wrapper parses this with the GENERIC
# `return_mode_from_string()` (nebula_common.hpp), NOT the Velodyne-specific
# `return_mode_from_string_velodyne()` that sits right next to it in
# velodyne_common.hpp. Only these four spellings parse:
#
#     SingleFirst  SingleStrongest  SingleLast  Dual
#
# The Velodyne web-UI names — `Strongest`, `Last` — parse to
# ReturnMode::UNKNOWN and the node dies at start-up, before it opens a socket:
#
#     terminate called after throwing an instance of 'std::runtime_error'
#       what():  Sensor configuration invalid: Invalid echo model provided
#
# The mapping to what the sensor reports over HTTP is:
#     SingleStrongest -> "Strongest"   SingleLast -> "Last"   Dual -> "Dual"
#
# Decoding itself is safe regardless: the decoder reads the return mode from
# packet byte 1204 rather than trusting this file. What a mismatch costs you is
# the frame rate and point count you thought you were recording with.
/**:
  ros__parameters:
    host_ip: 192.168.7.1
    sensor_ip: 192.168.7.10
    data_port: 2368
    gnss_port: 2369
    packet_mtu_size: 1500
    launch_hw: true
    setup_sensor: true
    frame_id: velodyne
    advanced_diagnostics: false
    diag_span: 1000
    calibration_file: $(find-pkg-share nebula_decoders)/calibration/velodyne/VLP32.yaml
    min_range: 0.3
    max_range: 300.0
    cloud_min_angle: 0
    cloud_max_angle: 360
    scan_phase: 0.0
    sensor_model: VLP32
    # 600 RPM = 10 Hz. Pushed to the sensor at start-up.
    rotation_speed: 600
    # Single-return. Dual roughly doubles points and packet rate
    # (~60k -> ~120k points per frame at 10 Hz), which every downstream stage
    # pays for. Spelling matters — see the note above.
    return_mode: SingleStrongest
    # Added in 32e92d7 together with the host_ip fix, reason unrecorded.
    # Setting this back to true disables the HTTP client, and with it
    # setup_sensor and the sensor diagnostics: rotation_speed and return_mode
    # would become assumptions about the EEPROM rather than settings.
    udp_only: false
